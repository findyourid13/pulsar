appId: com.pulsar.app
productName: Pulsar
copyright: Copyright © Pulsar contributors

directories:
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: findyourid13
  repo: pulsar
