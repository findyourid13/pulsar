<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sign in to Cosmo</title>
    <style>
      body {
        margin: 0;
        padding: 18px 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        color: #1a1a1a;
        background: #ececec;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.4;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .error {
        color: #b3261e;
        min-height: 16px;
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        padding: 5px 14px;
        font-size: 13px;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <form id="email-form">
      <p id="email-prompt">Enter your Cosmo email. Pulsar will send a 6-digit code to sign you in — no password.</p>
      <input id="email" type="email" placeholder="Email" autofocus autocomplete="email" spellcheck="false" />
      <p class="error" id="email-error"></p>
      <div class="row">
        <button type="button" id="email-cancel">Cancel</button>
        <button type="submit" id="email-continue">Continue</button>
      </div>
    </form>
    <form id="code-form" hidden>
      <p id="code-prompt">Enter the 6-digit code Cosmo just emailed you.</p>
      <input
        id="code"
        type="text"
        inputmode="numeric"
        placeholder="6-digit code"
        autocomplete="one-time-code"
        maxlength="6"
        spellcheck="false"
      />
      <p class="error" id="code-error"></p>
      <div class="row">
        <button type="button" id="code-cancel">Cancel</button>
        <button type="submit" id="code-signin">Sign in</button>
      </div>
    </form>
    <form id="nickname-form" hidden>
      <p id="nickname-prompt">Enter your Cosmo nickname, so Pulsar knows which collection is yours.</p>
      <input id="nickname" type="text" placeholder="Nickname" autocomplete="off" spellcheck="false" />
      <p class="error" id="nickname-error"></p>
      <div class="row">
        <button type="button" id="nickname-cancel">Cancel</button>
        <button type="submit" id="nickname-finish">Finish</button>
      </div>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
